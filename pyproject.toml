[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biofuels-sciml"
version = "0.1.0"
description = "Scientific machine learning utilities for biofuels modeling."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
